# Pre-commit config — mike fleet repo.
#
# Added 2026-08-01 (user mandate, after 4 real bugs traced to the same root cause: unescaped
# `"`/`` ` `` inside multi-line bash strings used as dispatch prompts or heredocs). Research:
# industry-standard practice is "escalate postmortem action items into automated checks that
# run before the bug can ship" (Google SRE postmortem culture) — for shell scripts, that means
# ShellCheck (the standard bash static analyzer) wired into a commit-time gate, not another
# paragraph in kb/coding_guidelines.md that has to be remembered by hand every time.
#
# See bin/shellcheck_gate.sh for WHY this gates on a curated code list instead of "any finding"
# (76 pre-existing advisory findings across this repo would otherwise block every commit) and
# kb/incidents/2026-08/2026-08-01-shellcheck-precommit-gate.md for the full incident trail.
#
# Setup (one-time per clone/worktree): pip install --user pre-commit shellcheck-py && pre-commit install
# Run by hand: pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: shellcheck-gate
        name: ShellCheck (curated hard-block list — see bin/shellcheck_gate.sh)
        entry: bin/shellcheck_gate.sh
        language: system
        files: '\.sh$'

      # Thêm 2026-08-02, sau lần thứ 5 user báo "message các topic Discord bị lẫn lộn". 4 lần
      # vá trước (2026-07-01, 07-06, 07-22, 07-22b) đều sửa đúng chỗ hỏng rồi vẫn tái phát
      # dưới dạng MỚI, vì cả 4 lần đều dựa vào CON NGƯỜI NHỚ dùng đúng biến/hàm có sẵn. Gate
      # này biến "dùng tên trong kb/discord_channels.json" thành điều kiện CƠ HỌC để commit.
      # Thêm 2026-08-12, sau lần thứ 3 cùng một hình dạng sự cố (07-31, 08-02, 08-12): một
      # commit từ NGOÀI job đang chạy cuốn theo file mà job đó đã `git add` nhưng chưa kịp
      # commit. `always_run` + `pass_filenames: false` là CỐ Ý: gate phải chạy trên MỌI commit
      # (kể cả commit chỉ có .md) và tự đọc TOÀN BỘ index, chứ không chỉ những file khớp một
      # pattern — đúng cái "không cần ai nhớ khai" mà --write-scope (opt-in) không làm được.
      - id: repo-commit-gate
        name: Commit-collision (job khác đang LIVE trong cùng repo — xem bin/repo_commit_gate.sh)
        entry: bin/repo_commit_gate.sh
        language: system
        always_run: true
        pass_filenames: false

      - id: discord-id-gate
        name: Discord ID trần (dùng tên trong kb/discord_channels.json — xem bin/discord_id_gate.sh)
        entry: bin/discord_id_gate.sh
        language: system
        files: '^(bin|hooks)/.*\.(sh|py)$'

      # Thêm 2026-08-21, sau 2 sự cố cùng ngày "giờ sai trong tin Discord": lần 1 do LLM
      # (đã chặn bằng header stamp ở ccdb outbound_format.py), lần 2 NGAY SAU deploy lần 1 do
      # chính dispatch.sh sinh `date -u … '+%H:%M UTC'` vào THÂN tin. Hai producer khác nhau,
      # cùng triệu chứng; coding_guidelines §16 đã dặn từ lâu vẫn lọt ⇒ biến §16 thành gate.
      # Bridge còn lớp quy đổi UTC→ICT ở transport (bảo hiểm), gate này chặn producer MỚI.
      - id: utc-text-gate
        name: Giờ UTC trong text gửi người (ICT + phút — xem bin/utc_text_gate.sh, §16)
        entry: bin/utc_text_gate.sh
        language: system
        files: '^(bin|hooks)/.*\.(sh|py)$'
