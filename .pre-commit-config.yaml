# Pre-commit config — OUTER repo (/home/trido/thanhdt), tức repo chứa WorkingClaude/.
#
# Đây là .pre-commit-config.yaml ĐẦU TIÊN của repo này (thêm 2026-08-08). Repo lồng
# WorkingClaude/mike/ có config RIÊNG của nó (mike/.pre-commit-config.yaml, wiring
# bin/shellcheck_gate.sh + bin/discord_id_gate.sh) — hai repo, hai hook độc lập, không thay
# thế nhau.
#
# Setup (một lần cho mỗi clone/worktree, chạy từ /home/trido/thanhdt):
#     pip install --user pre-commit && pre-commit install
# Chạy tay:  pre-commit run --all-files
#
repos:
  - repo: local
    hooks:
      # Kiểm kê 2026-08-08 (job Taylor_20260808_035850): 165 file khớp test_*.py / *_test.py ở
      # gốc WorkingClaude/, KHÔNG file nào có `def test_` — toàn bộ là script backtest/R&D đặt
      # tên theo thói quen lịch sử. kb/coding_guidelines.md §23 hệ luận 2 đã chốt quy ước
      # (test_* dành cho test thật; R&D dùng exp_*/probe_*/stress_*); hook này biến nó thành
      # điều kiện cơ học để commit, thay vì một đoạn văn phải nhớ. Chỉ chặn file MỚI —
      # xem header test_naming_gate.sh để biết vì sao phạm vi hẹp như vậy.
      - id: test-naming-gate
        name: test_*.py phải là test thật (xem WorkingClaude/test_naming_gate.sh)
        entry: WorkingClaude/test_naming_gate.sh
        language: system
        files: '^WorkingClaude/[^/]+\.py$'

      # Thêm 2026-08-30 (user duyệt) — hook ANH EM của `tz-anchor-gate` trong
      # WorkingClaude/mike/.pre-commit-config.yaml. Cùng một lớp lỗi (`datetime.now()` trần /
      # `date.today()` không neo timezone, coding_guidelines §16) đã nổ 5 lần trong 1 tuần ở CẢ
      # HAI repo — 3/5 ở repo NÀY (WorkingClaude/deploy_golive_dt5g_v4/golive_recommend_v23.py
      # :85+:1216, WorkingClaude/dna_report.py:69, commit 20bf2f20), nên gate phải có ở cả hai;
      # hai hook độc lập, không thay thế nhau.
      #
      # `entry` PHẢI là shim do CHÍNH repo này track, KHÔNG được trỏ thẳng vào repo lồng:
      # .gitignore:107 ẩn `WorkingClaude/mike/`, nên trong mọi worktree/clone mới đường dẫn đó
      # không tồn tại và pre-commit hỏng cứng ("Executable ... not found") ngay trên file SẠCH —
      # phạm vi hook gồm bot_execute.py + trading_bot/*.py, tức khoá luôn hotfix tiền thật, và
      # MIKE_TZ_GATE=off không cứu được vì script chưa chạy tới. Shim thiếu repo lồng thì CẢNH
      # BÁO + exit 0 (không gate được ≠ chặn). Chi tiết: WorkingClaude/tz_anchor_gate_shim.sh.
      # Bỏ qua có chủ đích:  SKIP=tz-anchor-gate git commit ...
      #
      # Ratchet đọc WorkingClaude/mike/kb/tz_anchor_baseline.json (157 vi phạm / 87 file ngày
      # bật). Commit từ repo NGOÀI cố ý KHÔNG tự ghi baseline của repo lồng. Siết bằng tay:
      #     WorkingClaude/mike/bin/tz_anchor_gate.py --update-baseline <file.py>
      # (mặc định chỉ HẠ được; nâng phải thêm --accept-new-debt).
      - id: tz-anchor-gate
        name: datetime.now()/date.today() không neo TZ (xem WorkingClaude/tz_anchor_gate_shim.sh, §16)
        entry: WorkingClaude/tz_anchor_gate_shim.sh
        language: system
        files: '^WorkingClaude/.*\.py$'
